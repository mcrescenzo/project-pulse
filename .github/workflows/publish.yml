name: Publish

# Stable, tag-driven npm publication. The ONLY path to the registry:
#   1. A maintainer pushes an exact stable tag `vX.Y.Z` on a commit reachable from protected main
#      (tag protection is a repository setting; creation is outside this workflow's authority).
#   2. `validate` proves tag/manifest/version binding; `checks` runs the shared release gate;
#   3. `pack` builds ONCE on the tagged commit with read-only permissions and uploads that single
#      tarball plus its recorded SHA-512;
#   4. `publish` — gated by the `npm-release` environment (maintainer approval) — downloads that
#      exact artifact, re-verifies its digest/name/version, and publishes it with provenance.
# No npm token secret exists in this repository: npm trusted publishing (OIDC) is bound to this
# workflow file, repository, and environment on the package settings. The 1.0.0-rc.N releases are
# the one deliberate exception: they are published manually with --tag next, not by this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag binding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bind.outputs.version }}
      filename: ${{ steps.bind.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: bind
        env:
          TAG_REF: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Exact stable semver only: no prerelease, no metadata, no v-prefix drift.
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Refusing non-stable release tag '$TAG_REF' (prereleases publish manually with --tag next)." >&2
            exit 1
          fi
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          if [ "$MANIFEST_VERSION" != "${TAG_REF#v}" ]; then
            echo "Refusing: tag $TAG_REF does not match manifest version $MANIFEST_VERSION." >&2
            exit 1
          fi
          # The tagged commit must be reachable from the protected trunk, not an orphan branch.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Refusing: tagged commit $TAG_SHA is not reachable from origin/main." >&2
            exit 1
          fi
          echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"
          echo "filename=project-pulse-${TAG_REF#v}.tgz" >> "$GITHUB_OUTPUT"

  checks:
    name: Shared release checks
    uses: ./.github/workflows/checks.yml

  pack:
    name: Build and pack the release artifact
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha512: ${{ steps.record.outputs.sha512 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist bundle
        run: bun run build

      - name: Pack release tarball (no lifecycle scripts)
        env:
          FILENAME: ${{ needs.validate.outputs.filename }}
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          npm pack --json --ignore-scripts --pack-destination dist-pack > pack-result.json
          ACTUAL="$(jq -r '.[0].filename' pack-result.json)"
          test "$ACTUAL" = "$FILENAME" || { echo "Unexpected artifact name: $ACTUAL" >&2; exit 1; }
          test -f "dist-pack/$FILENAME"

      - name: Record SHA-512
        id: record
        env:
          FILENAME: ${{ needs.validate.outputs.filename }}
        run: |
          set -euo pipefail
          DIGEST="$(sha512sum "dist-pack/$FILENAME" | cut -d' ' -f1)"
          echo "sha512=$DIGEST" >> "$GITHUB_OUTPUT"
          # The digest is recorded in its own step output (and shown in the run log) so the
          # publish job and the release reviewer can verify the artifact independently.
          echo "artifact sha512: $DIGEST"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tgz-${{ github.sha }}
          path: dist-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm (environment-gated)
    needs: [validate, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only elevated permission in the entire release path, and only in this environment-gated
    # job: OIDC provenance signing. No npm token secret exists.
    permissions:
      contents: read
      id-token: write
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Pin supported npm CLI (11.21.3 >= 11.5.1 required for --provenance)
        run: |
          set -euo pipefail
          npm install -g npm@11.21.3
          ACTUAL="$(npm --version)"
          test "$ACTUAL" = "11.21.3" || { echo "npm CLI pin failed: $ACTUAL" >&2; exit 1; }

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tgz-${{ github.sha }}
          path: dist-pack

      - name: Verify artifact digest, name, and version
        env:
          EXPECTED_SHA512: ${{ needs.pack.outputs.sha512 }}
          FILENAME: ${{ needs.validate.outputs.filename }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist-pack/$FILENAME"
          ACTUAL="$(sha512sum "dist-pack/$FILENAME" | cut -d' ' -f1)"
          test "$ACTUAL" = "$EXPECTED_SHA512" || { echo "Digest mismatch: $ACTUAL" >&2; exit 1; }
          tar -xzf "dist-pack/$FILENAME" package.json -O | jq -e \
            --arg v "$EXPECTED_VERSION" '.name == "project-pulse" and .version == $v' > /dev/null
          echo "Verified $FILENAME (sha512 $ACTUAL) for project-pulse@$EXPECTED_VERSION"

      - name: Publish the exact tarball with provenance
        env:
          FILENAME: ${{ needs.validate.outputs.filename }}
        run: |
          npm publish "dist-pack/$FILENAME" \
            --registry=https://registry.npmjs.org \
            --access public \
            --tag latest \
            --provenance \
            --ignore-scripts
