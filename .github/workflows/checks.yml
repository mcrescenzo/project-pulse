name: Release checks

# Both PR CI and tagged releases require the same runtime and package checks.
on:
  workflow_call:
    outputs:
      sha512:
        description: SHA-512 of the tested npm tarball
        value: ${{ jobs.pack.outputs.sha512 }}

permissions:
  contents: read

jobs:
  bun:
    name: Typecheck, test & roadmap check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Build dist bundle
        run: bun run build

      - name: Test
        env:
          PP_REQUIRE_UI_TESTS: "1"
          PP_TEST_CLI: ${{ github.workspace }}/dist/cli.js
        run: bun test

      - name: Validate roadmap (schema, DAG, ROADMAP.md sync)
        run: bun run src/cli.ts check

  bun-floor:
    name: Bun 1.3.0 declared floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist bundle
        run: bun run build

      - name: Pin Bun 1.3.0 (declared floor)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Locate Chromium and require Python PTY support
        run: |
          python3 -c "import pty"
          CHROME="$(command -v google-chrome || command -v chromium)"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Test under the declared Bun floor
        env:
          PP_REQUIRE_UI_TESTS: "1"
          PP_TEST_CLI: ${{ github.workspace }}/dist/cli.js
        run: bun test

  node-lts:
    name: Runtime matrix (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is the install/build tool here only; every test runs under Node on the built bundle.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Build dist bundle
        run: bun run build

      - name: Test under Node (same suites as Bun, in-process)
        env:
          PP_REQUIRE_UI_TESTS: "1"
        run: node node_modules/vitest/vitest.mjs run

      - name: Validate roadmap under Node
        run: node dist/cli.js check

  node-floor:
    name: Runtime matrix (Node 24.0.0 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Build dist bundle
        run: bun run build

      - name: Test under Node 24.0.0 floor (same suites, in-process)
        env:
          PP_REQUIRE_UI_TESTS: "1"
        run: node node_modules/vitest/vitest.mjs run

      - name: Validate roadmap under Node 24.0.0 floor
        run: node dist/cli.js check

  pack:
    name: Pack and smoke-test the npm artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha512: ${{ steps.pack.outputs.sha512 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true

      - name: Build, pack and validate the file list
        id: pack
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test ! -e dist
          bun install --frozen-lockfile
          bun run build
          test -z "$(git status --porcelain)"
          VERSION="$(node -p "require('./package.json').version")"
          DIR="$RUNNER_TEMP/npm-artifact"
          mkdir "$DIR"
          npm pack --json --ignore-scripts --pack-destination "$DIR" > "$RUNNER_TEMP/npm-pack.json"
          test "$(jq -r '.[0].filename' "$RUNNER_TEMP/npm-pack.json")" = "project-pulse-$VERSION.tgz"
          TARBALL="$DIR/project-pulse-$VERSION.tgz"
          ACTUAL_FILES="$(tar -tzf "$TARBALL" | LC_ALL=C sort)"
          diff -u <(printf '%s\n' package/LICENSE package/README.md package/dist/THIRD-PARTY-NOTICES.txt package/dist/cli.js package/package.json) \
            - <<< "$ACTUAL_FILES"
          SHA512="$(sha512sum "$TARBALL" | cut -d' ' -f1)"
          echo "artifact sha512: $SHA512"
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install and exercise the tarball on Node LTS without Bun
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: bash scripts/check-npm-consumer.sh node "$TARBALL" "$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.0.0

      - name: Install and exercise the tarball on Node 24.0.0 without Bun
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: bash scripts/check-npm-consumer.sh node "$TARBALL" "$VERSION"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Install and exercise the tarball on Bun 1.3.0 without Node
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: bash scripts/check-npm-consumer.sh bun "$TARBALL" "$VERSION"

      - name: Upload the tested release artifact
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tgz-${{ github.sha }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7
