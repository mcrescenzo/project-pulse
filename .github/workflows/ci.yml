name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test & roadmap check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Test
        env:
          PP_REQUIRE_UI_TESTS: "1"
        run: bun test

      - name: Build dist bundle
        run: bun run build

      - name: Validate roadmap (schema, DAG, ROADMAP.md sync)
        run: bun run src/cli.ts check

      - name: Pin Bun 1.3.0 (declared floor)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Test frontmatter round-trip on floor Bun
        run: bun test tests/frontmatter-roundtrip.test.ts

      - name: Run built artifact on floor Bun
        run: |
          test "$(bun dist/cli.js --version)" = "$(bun run src/cli.ts --version)"
          bun dist/cli.js --help > /dev/null

  node-lts:
    name: Typecheck-free runtime matrix (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is the install/build tool here only; every test runs under Node on the built bundle.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Build dist bundle
        run: bun run build

      - name: Test under Node (same suites as Bun, in-process)
        env:
          PP_REQUIRE_UI_TESTS: "1"
        run: node node_modules/vitest/vitest.mjs run

      - name: Validate roadmap under Node
        run: node dist/cli.js check

  node-floor:
    name: Runtime matrix (Node 24.0.0 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert test toolchain present (git, python3 + pty, Chromium)
        run: |
          command -v git
          command -v python3
          python3 -c "import pty"
          command -v google-chrome || command -v chromium

      - name: Locate Chrome for browser UI tests
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Build dist bundle
        run: bun run build

      - name: Test under Node 24.0.0 floor (same suites, in-process)
        env:
          PP_REQUIRE_UI_TESTS: "1"
        run: node node_modules/vitest/vitest.mjs run

      - name: Validate roadmap under Node 24.0.0 floor
        run: node dist/cli.js check
